<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenSchool - Corrections</title><link rel="stylesheet" href="senschool.css"></head>
<body>
<a class="retour" href="senschool-dashboard.html">⬅️ Retour au tableau de bord</a>
<h1 id="titre">Corrections (directeur)</h1>
<div id="zone" hidden>
<div style="display:flex;gap:6px;margin-bottom:8px">
<button class="petit" data-t="insc">Élèves</button><button class="petit gris" data-t="pai">Paiements</button><button class="petit gris" data-t="dep">Dépenses</button></div>
<input id="recherche" placeholder="Rechercher">
<div id="edition" class="card" hidden></div>
<div id="liste"></div>
</div>
<script src="senschool.js"></script><script src="senschool-outils.js"></script>
<script>
if(typeof fcfa==='undefined'){window.fcfa=function(n){return (Number(n)||0).toLocaleString('fr-FR')+' FCFA'}}
if(typeof dateFr==='undefined'){window.dateFr=function(d){return (d||'').slice(0,10).split('-').reverse().join('/')}}
let onglet='insc',dir=false;
const LIMITE=['telParent','nomParent','dateNaissance','adresse'];
const CH={
 insc:[['nom','Nom','text'],['nomParent','Nom du parent / tuteur','text'],['telParent','Téléphone WhatsApp du parent','tel'],['dateNaissance','Date de naissance','date'],['adresse','Adresse','text'],['classeFrancaise','Classe française','select',['','Préscolaire','CI','CP','CE1','CE2','CM1','CM2']],['niveauArabe','Niveau arabe','select',['Niveau 1','Niveau 2','Niveau 3','Niveau 4','Niveau 5']],['cursus','Cursus','select',['Franco-arabe','Arabe uniquement']],['regime','Régime','select',['Standard','Semi-internat','Internat']],['statutAide','Cas social (directeur seul)','select',['Normal','Gratuité totale','Réduction']],['reducInscription','Remise inscription (FCFA)','number'],['reducMensualite','Remise mensualité / mois (FCFA)','number'],['motifAide','Motif du cas social','text']],
 pai:[['typePaiement','Type','select',['Inscription','Mensualité','Autres frais']],['montant','Montant (FCFA)','number'],['datePaiement','Date','date']],
 dep:[['motif','Motif','text'],['montant','Montant (FCFA)','number'],['date','Date','date']]
};
const LIB={insc:['Archiver','Restaurer'],pai:['Annuler ce paiement','Rétablir'],dep:['Supprimer','Rétablir']};
const ETAT={insc:'ARCHIVÉ',pai:'ANNULÉ',dep:'SUPPRIMÉ'};
function resume(c,r){
  if(c==='insc'){var b=(r.matricule||'-')+' — '+r.nom+' — '+(r.classeFrancaise||r.niveauArabe||r.cursus)+' — '+(r.anneeScolaire||'');if(r.statutAide&&r.statutAide!=='Normal')b+=' — 🎓 '+r.statutAide;if(!r.telParent)b+=' — ⚠️ pas de téléphone';return b}
  if(c==='pai')return (r.numeroRecu||'-')+' — '+dateFr(r.datePaiement)+' — '+r.nomEleve+' — '+r.typePaiement+' — '+fcfa(r.montant);
  return dateFr(r.date)+' — '+r.motif+' — '+fcfa(r.montant);
}
function afficher(){
  const q=$('recherche').value.trim().toLowerCase(),z=$('liste');z.innerHTML='';
  const l=brut(onglet).slice().reverse();
  if(!l.length)z.textContent='Aucun enregistrement.';
  l.forEach(function(r){
    const t=resume(onglet,r);
    if(q&&t.toLowerCase().indexOf(q)<0)return;
    const d=document.createElement('div');d.className='card';
    const p=document.createElement('div');p.textContent=t;p.style.fontWeight='bold';
    if(r.archive){p.style.textDecoration='line-through';p.style.color='#777'}
    d.appendChild(p);
    const info=document.createElement('div');info.style.cssText='font-size:.8em;color:#666;margin:4px 0';
    let s=r.creePar?'Saisi par '+r.creePar:'';
    if(r.archive)s+=(s?' · ':'')+ETAT[onglet]+(r.archivePar?' par '+r.archivePar:'');
    const h=r.hist&&r.hist[r.hist.length-1];
    if(h)s+=(s?' · ':'')+'✏️ modifié par '+h.par+' le '+dateFr(h.le.slice(0,10));
    if(onglet==='insc'&&typeof totauxEleveB!=='undefined'){try{var tt=totauxEleveB(r);s+=(s?' · ':'')+'Reste : '+fcfa(tt.resteTotal)}catch(e){}}
    info.textContent=s;d.appendChild(info);
    function bouton(txt,cls,f){const b=document.createElement('button');b.textContent=txt;b.className='petit '+cls;b.style.marginRight='6px';b.onclick=f;d.appendChild(b)}
    if(!r.archive)bouton(dir?'Modifier':'Compléter la fiche','gris',function(){ouvrirEdition(onglet,r)});
    if(dir){
      bouton(r.archive?LIB[onglet][1]:LIB[onglet][0],r.archive?'':'rouge',function(){basculer(onglet,r.id)});
      if(onglet==='insc'&&r.archive)bouton('Supprimer définitivement','rouge',function(){supprimerEleve(r)});
    }
    z.appendChild(d);
  });
}
function ouvrirEdition(c,r){
  const z=$('edition');z.hidden=false;z.innerHTML='';
  const t=document.createElement('b');t.textContent='Modifier : '+resume(c,r);z.appendChild(t);
  const champs={};
  CH[c].filter(function(d){return dir||LIMITE.indexOf(d[0])>-1}).forEach(function(d){
    const lb=document.createElement('label');lb.textContent=d[1];z.appendChild(lb);
    let el;
    if(d[2]==='select'){el=document.createElement('select');d[3].forEach(function(v){const o=document.createElement('option');o.value=o.textContent=v;el.appendChild(o)})}
    else{el=document.createElement('input');el.type=d[2]}
    el.value=r[d[0]]!==undefined?r[d[0]]:(d[0]==='statutAide'?'Normal':'');
    z.appendChild(el);champs[d[0]]=el;
  });
  const ok=document.createElement('button');ok.textContent='Enregistrer';ok.onclick=function(){sauver(c,r.id,champs)};
  const an=document.createElement('button');an.textContent='Fermer';an.className='gris';an.onclick=function(){z.hidden=true};
  z.appendChild(ok);z.appendChild(an);window.scrollTo(0,0);
}
function sauver(c,id,champs){
  const l=brut(c),r=l.find(function(x){return x.id===id});if(!r)return;
  const avant={};
  for(const k of Object.keys(champs)){
    let v=champs[k].value;
    if(k==='reducInscription'||k==='reducMensualite'){v=Number(v)||0}
    else if(champs[k].type==='number'){v=Number(v);if(!(v>0)){alert('Montant invalide.');return}}
    if(k==='nom'&&!String(v).trim()){alert('Le nom est obligatoire.');return}
    if(typeof v==='string')v=v.trim();
    if(r[k]!==v&&!(r[k]===undefined&&v==='')){avant[k]=r[k];r[k]=v}
  }
  if(!Object.keys(avant).length){$('edition').hidden=true;return}
  r.hist=(r.hist||[]).concat([{le:new Date().toISOString(),par:cloud.user.email,avant:avant}]);
  if(c==='insc'&&avant.nom!==undefined){const pl=brut('pai');pl.forEach(function(p){if(p.matricule&&p.matricule===r.matricule)p.nomEleve=r.nom});ecrire('pai',pl)}
  ecrire(c,l);$('edition').hidden=true;afficher();alert('✅ Modification enregistrée.');
}
function basculer(c,id){
  const l=brut(c),r=l.find(function(x){return x.id===id});if(!r)return;
  if(!r.archive&&!confirm(LIB[c][0]+' ?'))return;
  if(r.archive){delete r.archive;delete r.archiveLe;delete r.archivePar}
  else{r.archive=true;r.archiveLe=new Date().toISOString();r.archivePar=cloud.user.email}
  ecrire(c,l);afficher();
}
function supprimerEleve(r){
  const aPai=brut('pai').some(function(p){return p.matricule?p.matricule===r.matricule:p.nomEleve===r.nom});
  if(aPai){alert("Impossible : cet élève a des paiements. Il reste archivé.");return}
  if(!confirm('Supprimer DÉFINITIVEMENT '+r.nom+' ?'))return;
  const s=JSON.stringify(brut('insc').filter(function(x){return x.id!==r.id}));
  localStorage.setItem(CLES.insc,s);
  envoyer('insc',s).catch(function(e){alert('⚠️ Erreur : '+e.message)});
  afficher();
}
document.querySelectorAll('[data-t]').forEach(function(b){
  b.onclick=function(){onglet=b.dataset.t;document.querySelectorAll('[data-t]').forEach(function(x){x.className='petit gris'});b.className='petit';$('edition').hidden=true;afficher()};
});
$('recherche').addEventListener('input',afficher);
quandPret(function(){
  dir=estDirecteur();
  if(!dir){document.querySelectorAll('[data-t="pai"],[data-t="dep"]').forEach(function(b){b.style.display='none'});$('titre').textContent='Compléter les fiches des élèves'}
  $('zone').hidden=false;afficher();setTimeout(afficher,2500);
});
</script></body></html>
