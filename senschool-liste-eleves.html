<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenSchool - Liste des élèves</title><link rel="stylesheet" href="senschool.css"></head>
<body>
<a class="retour" href="senschool-dashboard.html">⬅️ Retour au tableau de bord</a>
<h1>Liste des élèves inscrits</h1><p>École Al Islah - Yeumbeul Nord</p>
<input id="recherche" placeholder="Rechercher un élève">
<div class="defile"><table><thead><tr><th>Nom</th><th>Cursus</th><th>Classe</th><th>Régime</th><th></th></tr></thead><tbody id="corps"></tbody></table></div>
<script src="senschool.js"></script>
<script>
function afficher(){
  const q=$('recherche').value.trim().toLowerCase(),corps=$('corps');corps.innerHTML='';
  lire('insc').forEach(function(e,i){
    if(!e.nom.toLowerCase().includes(q))return;
    const tr=ligne(corps,[e.nom,e.cursus,e.classeFrancaise||'-',e.regime]);
    const td=document.createElement('td'),b=document.createElement('button');
    b.textContent='Supprimer';b.className='rouge petit';
    b.addEventListener('click',function(){
      if(confirm('Supprimer cet élève ?')){const l=lire('insc');l.splice(i,1);ecrire('insc',l);afficher()}
    });
    td.appendChild(b);tr.appendChild(td);
  });
}
$('recherche').addEventListener('input',afficher);afficher();
</script></body></html>
