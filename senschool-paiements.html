<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SenSchool - Paiements</title><link rel="stylesheet" href="senschool.css"></head>
<body>
<a class="retour" href="senschool-dashboard.html">⬅️ Retour au tableau de bord</a>
<h1>Paiements scolaires</h1><p>École Al Islah - Yeumbeul Nord</p>
<form id="f">
<label>Année scolaire</label><select id="annee" required><option value="">Choisir une année</option></select>
<label>Élève (inscrit)</label><select id="eleve" required><option value="">Choisir un élève</option></select>
<div id="recap" class="card" hidden style="background:#f7f5ec;margin:10px 0"></div>
<label>Type de paiement</label><select id="type" required><option value="">Choisir un type</option></select>
<label>Montant payé (FCFA)</label><input id="montant" type="number" min="1" required>
<label>Date du paiement</label><input id="date" type="date" required>
<button type="submit">Enregistrer le paiement</button>
</form>
<p id="total"></p>
<div class="defile"><table><thead><tr><th>Date</th><th>Élève</th><th>Type</th><th>Montant</th></tr></thead><tbody id="corps"></tbody></table></div>
<script src="senschool.js"></script>
<script>
const DEBUT_MOIS=9;
const AR_=langue()==='ar';
const T=AR_?{tarif:'التعريفة',ins:'التسجيل',men:'القسط الشهري',du:'المستحق إلى حد اليوم',paye:'المدفوع إلى الآن',rj:'المتبقي إلى حد اليوم',ra:'المتبقي للسنة كاملة',ok:'الحساب مسدد ✅',aucun:'⚠️ لا توجد تعريفة لهذا التلميذ',m:'أقساط'}
:{tarif:'Tarif',ins:'inscription',men:'mensualité',du:'Dû à ce jour',paye:'Déjà payé',rj:'Reste à payer à ce jour',ra:'Reste pour toute l\'année',ok:'À jour ✅',aucun:'⚠️ Aucun tarif défini pour cet élève',m:'mensualités'};
remplir($('annee'),['2026-2027','2027-2028']);
remplir($('type'),['Inscription','Mensualité','Autres frais']);
$('date').value=new Date().toISOString().slice(0,10);
function moisEchus(annee){const a=Number(annee.split('-')[0]),auj=new Date();let n=0;for(let k=0;k<12;k++){if(new Date(a,DEBUT_MOIS+k,5)<=auj)n++}return n}
function tarifDe(e){return lire('frais').find(function(x){return x.anneeScolaire===e.anneeScolaire&&x.cursus===e.cursus&&x.regime===e.regime})}
function payeDe(e){return lire('pai').filter(function(p){return (p.matricule?p.matricule===e.matricule:p.nomEleve===e.nom)&&p.anneeScolaire===e.anneeScolaire&&p.typePaiement!=='Autres frais'}).reduce(function(s,p){return s+p.montant},0)}
function eleveChoisi(){return lire('insc').find(function(e){return (e.matricule||e.nom)===$('eleve').value&&e.anneeScolaire===$('annee').value})}
function remplirEleves(){
  $('eleve').length=1;
  lire('insc').filter(function(e){return e.anneeScolaire===$('annee').value}).forEach(function(e){
    const o=document.createElement('option');o.value=e.matricule||e.nom;o.textContent=(e.matricule?e.matricule+' — ':'')+e.nom;$('eleve').appendChild(o)});
  recap();
}
function recap(){
  const e=eleveChoisi(),z=$('recap');
  z.innerHTML='';
  if(!e){z.hidden=true;return}
  z.hidden=false;
  function ligneTexte(t,c,g){const d=document.createElement('div');d.textContent=t;if(c)d.style.color=c;if(g)d.style.fontWeight='bold';d.style.margin='4px 0';z.appendChild(d)}
  const f=tarifDe(e);
  if(!f){ligneTexte(T.aucun,'#b91c1c',true);return}
  const n=moisEchus(e.anneeScolaire),m=f.mensualite||0,ins=f.inscription||0,pay=payeDe(e);
  const rj=ins+n*m-pay,ra=ins+12*m-pay;
  ligneTexte(T.tarif+' : '+T.ins+' '+fcfa(ins)+' — '+T.men+' '+fcfa(m));
  ligneTexte(T.du+' ('+n+' '+T.m+') : '+fcfa(ins+n*m));
  ligneTexte(T.paye+' : '+fcfa(pay));
  ligneTexte(rj>0?T.rj+' : '+fcfa(rj):T.ok,rj>0?'#b91c1c':'#14532d',true);
  ligneTexte(T.ra+' : '+fcfa(Math.max(ra,0)));
}
function afficher(){
  const l=lire('pai');$('corps').innerHTML='';
  l.forEach(function(p){ligne($('corps'),[dateFr(p.datePaiement),p.nomEleve,p.typePaiement,fcfa(p.montant)])});
  $('total').textContent=l.length+' - '+fcfa(l.reduce(function(s,p){return s+p.montant},0));
}
$('annee').addEventListener('change',remplirEleves);
$('eleve').addEventListener('change',recap);
afficher();
$('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  const e=eleveChoisi();if(!e){alert('Choisis un élève.');return}
  const montant=Number($('montant').value),type=$('type').value,f=tarifDe(e);
  if(f&&type!=='Autres frais'){
    const ra=(f.inscription||0)+12*(f.mensualite||0)-payeDe(e);
    if(montant>ra&&!confirm("Ce montant dépasse le reste à payer de l'année ("+fcfa(Math.max(ra,0))+"). Continuer ?"))return;
  }
  const l=lire('pai');
  l.push({nomEleve:e.nom,matricule:e.matricule||'',anneeScolaire:e.anneeScolaire,typePaiement:type,montant:montant,datePaiement:$('date').value});
  ecrire('pai',l);$('montant').value='';afficher();recap();alert('✅ Paiement enregistré.');
});
</script></body></html>
